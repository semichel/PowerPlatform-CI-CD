<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gissa Namnet! - Pokémon &amp; Naruto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="logo">
                <h1>Gissa Namnet!</h1>
                <p class="subtitle">Pokémon &amp; Naruto &#x2013; Special Edition &#x2764;&#xFE0F;</p>
                <p class="version">v2.0</p>
            </div>

            <div class="start-options">
                <div class="rules-card">
                    <div class="rules-title">Så funkar det</div>
                    <ul class="rules-list">
                        <li>Du börjar med <strong>500 kr</strong></li>
                        <li>Varje rätt svar ger <strong>+100 kr</strong></li>
                        <li>Målet är att nå <strong>5 000 kr</strong></li>
                        <li>Svarar du fel åker du tillbaka till 500 kr</li>
                    </ul>
                </div>
                <div class="category-select">
                    <label>Välj kategorier:</label>
                    <div id="category-buttons"></div>
                </div>
                <div id="best-record" class="best-record hidden"></div>
                <button class="btn-primary" onclick="startGame()">Starta spelet!</button>
            </div>

            <button class="btn-secondary btn-small-text" onclick="resetQuestionHistory()">Nollställ frågehistorik</button>
            <button class="btn-secondary btn-small-text" onclick="toggleFlip()">Vänd skärmen</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="round-info">Fråga <span id="question-count">1</span></div>
                <div class="streak-info" id="streak-info"></div>
                <button class="btn-flip" onclick="toggleFlip()" title="Vänd skärmen">&#x1F503;</button>
            </div>

            <div class="wallet">
                <div class="wallet-top">
                    <span class="wallet-label">Din plånbok</span>
                    <span class="wallet-goal">Mål: 5 000 kr</span>
                </div>
                <div class="wallet-amount" id="wallet-amount">500 kr</div>
                <div class="wallet-progress">
                    <div class="wallet-progress-bar" id="wallet-progress-bar"></div>
                </div>
            </div>

            <div class="question-card">
                <div class="card-category" id="card-category"></div>
                <div class="card-question" id="card-question"></div>
                <img id="card-image" class="card-image hidden" alt="">
            </div>

            <div class="options-grid" id="options-container"></div>

            <div id="result-area" class="result-area hidden">
                <div id="result-text"></div>
                <div id="result-points"></div>
                <div class="result-buttons">
                    <button class="btn-primary" id="next-btn" onclick="nextQuestion()">Nästa fråga</button>
                </div>
            </div>

            <button class="btn-secondary btn-small-text" onclick="quitGame()">Avsluta spelet</button>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="screen">
            <div id="end-emoji" class="end-emoji"></div>
            <h1 id="end-title">Spelet är slut!</h1>
            <div id="end-summary" class="end-summary"></div>
            <div id="end-record" class="end-record"></div>
            <button class="btn-primary" onclick="resetGame()">Spela igen</button>
        </div>
    </div>

    <script src="logger.js"></script>
    <script src="characters.js"></script>
    <script src="questions.js"></script>
    <script src="game.js"></script>
</body>
</html>
